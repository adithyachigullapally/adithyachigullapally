name: Profile animations

on:
  schedule:
    - cron: "7 * * * *" # hourly, at :07 (the top of the hour is when most scheduled runs queue up)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: mkdir -p dist

      # The card service draws the number; we serve its picture from our own branch because
      # GitHub's image proxy is blocked on some networks. A cache-busting query makes the
      # service recompute it, and a failure turns the run red instead of silently
      # republishing the old picture (that is how the number used to get stuck).
      - run: |
          url="https://streak-stats.demolab.com?user=${{ github.repository_owner }}&theme=dark&hide_border=true&background=0D1117&ring=00FFA3&fire=00FFA3&currStreakLabel=00FFA3&hide_current_streak=true&hide_longest_streak=true"
          for try in 1 2 3; do
            if curl -fsSL --max-time 30 -o dist/contributions.svg "$url&cb=${{ github.run_id }}$try"; then
              echo "card fetched on try $try: $(sed -e 's/<[^>]*>/ /g' dist/contributions.svg | tr -s ' 
' ' ' | grep -oE '[0-9]+ *Total Contributions')"
              exit 0
            fi
            sleep 10
          done
          echo "::error::card service did not answer; refusing to republish a stale card"
          exit 1

      # pinned to a main commit: no release tag has `no-commit` yet (v2.0.5 lacks it)
      - uses: czl9707/gh-space-shooter@158ae82cc0dc704f06a71c87dc40afdfebcc6f88
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: dist/space-shooter.gif
          no-commit: true

      # publish dist/ to the `output` branch so bot commits never touch main
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
